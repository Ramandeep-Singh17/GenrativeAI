[project]
name = "genai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramandeep Singh", email = "omraman3333@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "groq>=0.37.1",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.3",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mistralai>=1.1.6",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "mistralai>=2.10.1",
    "numpy>=2.4.6",
    "openai>=3.16.2",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.64.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.53.0",
]

[project.scripts]
genai = "genai:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
